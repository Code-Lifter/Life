<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Be Useful Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: loading-platform header with a barbell that fills plate by plate; step rail left, one tool per screen right. */
:root {
  --bg: #E9ECEE;
  --surface: #FFFFFF;
  --surface-2: #F3F5F6;
  --ink: #15191D;
  --muted: #59626B;
  --line: #D0D6DB;
  --accent: #C41E2C;
  --accent-ink: #FFFFFF;
  --bar: #8A9299;
  --focus: #1F5FD1;
  /* competition plate colours (IWF) */
  --p-red: #D62331;
  --p-blue: #1F5FD1;
  --p-yellow: #F2B705;
  --p-green: #1E9E57;
  --p-white: #F4F4F2;
  --p-chrome: #B9C0C6;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #1A1F24; --surface-2: #20262C; --ink: #E8EBEE; --muted: #97A1AA;
    --line: #2D353C; --accent: #FF4D5A; --accent-ink: #14080A; --bar: #6E777F; --focus: #7FA8FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #1A1F24; --surface-2: #20262C; --ink: #E8EBEE; --muted: #97A1AA;
  --line: #2D353C; --accent: #FF4D5A; --accent-ink: #14080A; --bar: #6E777F; --focus: #7FA8FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1; letter-spacing: .01em; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* header + barbell */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.brand h1 { font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 900; text-transform: uppercase; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
.readout { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.readout b { display: block; font-family: var(--f-display); font-size: 2.2rem; color: var(--ink); font-weight: 800; line-height: 1; }
.platform { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 12px 10px; overflow: hidden; }
.barbell { position: relative; height: 92px; display: flex; align-items: center; justify-content: center; }
.barbell .shaft { position: absolute; left: 4%; right: 4%; height: 8px; background: var(--bar); border-radius: 2px; }
.side { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; gap: 2px; }
.side.l { right: 74%; flex-direction: row-reverse; }
.side.r { left: 74%; }
.collar { width: 8px; height: 30px; background: var(--bar); border-radius: 2px; }
.plate { border-radius: 3px; border: 1px solid rgba(0,0,0,.25); transform-origin: center; animation: drop .35s ease-out; }
.plate.empty { background: transparent; border: 1px dashed var(--line); animation: none; }
@keyframes drop { from { transform: scaleY(.6); opacity: .3; } to { transform: none; opacity: 1; } }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; margin-top: 6px; font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); }
.legend .off { opacity: .45; }

/* shell */
.shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; margin-top: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 2px; }
.rail button { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 8px 10px; cursor: pointer; color: var(--muted); font-size: .92rem; }
.rail button:hover { background: var(--surface-2); color: var(--ink); }
.rail button[aria-current="step"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
.rail .num { font-family: var(--f-display); font-weight: 800; font-size: 1.25rem; text-align: center; }
.rail .chip { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--line); }
.rail .done .chip { border-color: transparent; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: clamp(18px, 4vw, 36px); min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.eyebrow i { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); }
.panel h2 { font-size: clamp(2.2rem, 6vw, 3.4rem); font-weight: 900; text-transform: uppercase; margin-top: 8px; }
.idea { font-size: 1.08rem; max-width: 62ch; margin: 14px 0 0; }
.group { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
.group h3 { font-size: 1.45rem; font-weight: 800; text-transform: uppercase; }
.group > p { margin: -6px 0 0; color: var(--muted); max-width: 62ch; }
.field { display: grid; gap: 6px; }
.field label, .field .lbl { font-weight: 600; font-size: .95rem; }
.field .hint { color: var(--muted); font-size: .85rem; }
input[type=text], input[type=number], input[type=date], textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; line-height: 1.45;
}
textarea { min-height: 84px; resize: vertical; }
input[type=number] { max-width: 140px; font-variant-numeric: tabular-nums; }
input[type=date] { max-width: 220px; }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; cursor: pointer; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.range { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 12px; align-items: center; }
.range input { width: 100%; accent-color: var(--accent); }
.range output { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 500; }
.choices input { accent-color: var(--accent); }
.choices label:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.calc { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
.calc .big { font-family: var(--f-display); font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.calc .k { font-family: var(--f-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; margin-top: 4px; }
.calc .note { flex-basis: 100%; color: var(--muted); font-size: .9rem; margin: 0; }
.pill { display: inline-block; font-family: var(--f-mono); font-size: .78rem; padding: 3px 10px; border-radius: 999px; color: #fff; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 11px 18px; font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn.quiet { border-color: transparent; color: var(--muted); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* intro */
.intro-lede { font-size: 1.15rem; max-width: 60ch; margin: 16px 0 0; }
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 26px; }
.tool-card { text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 14px 1fr; gap: 4px 10px; align-items: center; }
.tool-card:hover { border-color: var(--muted); }
.tool-card i { width: 14px; height: 30px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); grid-row: span 2; }
.tool-card b { font-family: var(--f-display); font-size: 1.2rem; text-transform: uppercase; font-weight: 800; line-height: 1.05; }
.tool-card small { color: var(--muted); font-family: var(--f-mono); font-size: .72rem; }
.notice { margin-top: 18px; font-size: .88rem; color: var(--muted); max-width: 62ch; }
.confirm { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: .92rem; }

/* plan */
.plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 24px; }
.plan-item { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; border-left: 6px solid var(--c, var(--line)); min-width: 0; }
.plan-item h4 { margin: 0 0 6px; font-family: var(--f-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }
.plan-item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.plan-item .empty { color: var(--muted); font-style: italic; }
.plan-item .go { margin-top: 8px; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: .85rem; font-weight: 600; }
.vision-hero { margin-top: 20px; background: var(--surface-2); border-radius: 6px; padding: 20px; border: 1px solid var(--line); }
.vision-hero h4 { margin: 0 0 6px; font-family: var(--f-mono); font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 500; }
.vision-hero p { margin: 0; font-family: var(--f-display); font-size: clamp(1.5rem, 3.6vw, 2.1rem); font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.week { margin-top: 28px; }
.week h3 { font-size: 1.6rem; font-weight: 800; text-transform: uppercase; }
.week ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.week li label { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; cursor: pointer; }
.week li input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.week li input:checked + span { text-decoration: line-through; color: var(--muted); }
.copied { font-size: .88rem; color: var(--muted); align-self: center; }
.source { margin-top: 32px; font-size: .82rem; color: var(--muted); }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .rail { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; }
  .rail button { grid-template-columns: auto auto; width: auto; flex: none; padding: 6px 10px; }
  .rail .name { display: none; }
  .rail button:first-child .name, .rail button:last-child .name { display: inline; }
  .rail .num { font-size: 1.1rem; }
  .barbell { height: 70px; }
  .side.l { right: 70%; } .side.r { left: 70%; }
}
@media (prefers-reduced-motion: reduce) { .plate { animation: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Be Useful</h1>
      <p>A seven-tool workbook. Load a plate for every tool you work through.</p>
    </div>
    <div class="readout" aria-live="polite"><b id="kg">20 kg</b><span id="kgsub">empty bar · 0 of 7 tools</span></div>
  </header>
  <div class="platform" aria-hidden="true">
    <div class="barbell"><div class="shaft"></div><div class="side l" id="sideL"></div><div class="side r" id="sideR"></div></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="Workbook steps"></nav>
    <main class="panel" id="panel"></main>
  </div>
</div>

<script>
const TOOLS = [
  { id: 'vision', n: 1, kg: 25, color: '--p-red', title: 'Have a Clear Vision', key: 'v_statement',
    idea: 'Most people who feel stuck don\'t lack effort. They lack a destination. A vision is a specific picture of where you want to end up, and once you can see it, every daily choice gets easier: it either moves you toward the picture or it doesn\'t.',
    groups: [
      { h: 'Start broad and zoom in', p: 'Begin with whatever pulls at you, even if it\'s fuzzy. Then narrow it until you could describe it to a stranger.', fields: [
        { id: 'v_broad', type: 'textarea', label: 'What has fascinated you since you were young, before anyone told you what to think about it?', ph: 'Lifting, building things, coaching the younger kids at footy…' },
        { id: 'v_zoom', type: 'textarea', label: 'Zoom in. What exactly do you want? Name the place, the role, the result.', ph: 'My own strength gym, in my home town, coaching people who\'ve never lifted.' } ] },
      { h: 'Create space and time', p: 'A vision rarely shows up while you\'re busy. It appears on a walk, a long drive or a session with your phone in the locker.', fields: [
        { id: 'v_space', type: 'text', label: 'When and where will you give yourself thinking time this week?', ph: 'Sunday 7 am walk, no phone' } ] },
      { h: 'Really see it', p: 'Picture the finished result so clearly you could describe the room you\'re standing in.', fields: [
        { id: 'v_statement', type: 'textarea', label: 'Write your vision in the present tense, as if it\'s already true.', ph: 'I own a 400 m² strength gym with 120 members. I coach every morning and…', hint: 'This line heads your final plan.' } ] },
      { h: 'Look in the mirror', p: 'Check that the picture is yours, and not one your parents, partner or friends handed to you.', fields: [
        { id: 'v_mine', type: 'check', label: 'This is what I want, not what other people expect of me.' },
        { id: 'v_why', type: 'text', label: 'Why does it matter to you?', ph: 'Because training changed my life and I want to pass that on.' } ] }
    ] },
  { id: 'big', n: 2, kg: 20, color: '--p-blue', title: 'Never Think Small', key: 'n_big',
    idea: 'Small goals feel safe, but they rarely draw out your best effort. Aim high enough that even falling short lands you somewhere worthwhile, and then commit with everything you have.',
    groups: [
      { h: 'Wenn schon, denn schon', p: 'An Austrian saying: if you\'re going to do something, go all the way.', fields: [
        { id: 'n_big', type: 'textarea', label: 'Take your vision and make it bigger. What does the all-in version look like?', ph: 'Not one gym: a coaching method and three locations, with a youth programme in each.' } ] },
      { h: 'Ignore the naysayers', p: 'People size your goal against their own limits. Hear the doubt, then answer it.', fields: [
        { id: 'n_doubt', type: 'textarea', label: 'Who or what says it can\'t be done? Write the doubt, then your answer.', ph: '"Gyms fail all the time." So I\'ll build the client list before I sign a lease.' } ] },
      { h: 'No plan Bs', p: 'A fallback plan quietly gives you permission to quit when it gets hard.', fields: [
        { id: 'n_planb', type: 'text', label: 'What safety net are you keeping that makes giving up easier?', ph: 'Going back to full-time site work "if it doesn\'t work out"' },
        { id: 'n_cut', type: 'check', label: 'I\'ll stop treating that as an option.' } ] },
      { h: 'Break records and blaze trails', p: 'Somebody has to be first. It might as well be you.', fields: [
        { id: 'n_first', type: 'text', label: 'What would you be the first to do, in your family, your town or your field?', ph: 'First in my family to run my own business' } ] }
    ] },
  { id: 'work', n: 3, kg: 15, color: '--p-yellow', title: 'Work Your Ass Off', key: 'w_rep',
    idea: 'There\'s no shortcut. Results come from reps, done consistently, including the reps that hurt. And there are more hours in your day for them than you think.',
    groups: [
      { h: 'Reps, reps, reps', p: 'Mastery is repetition. Pick the smallest action you can repeat without needing motivation.', fields: [
        { id: 'w_rep', type: 'text', label: 'Your daily rep: one action that moves the vision forward.', ph: 'Write and post one coaching tip; message one potential client' },
        { id: 'w_freq', type: 'range', label: 'Days a week you\'ll do it', min: 1, max: 7, step: 1, def: 5, unit: 'days' } ] },
      { h: 'Pain is temporary', p: 'The hard part of the work is usually where the growth is. Decide in advance what you\'ll push through.', fields: [
        { id: 'w_pain', type: 'text', label: 'What discomfort are you willing to accept?', ph: 'Early starts, awkward sales calls, studying after a shift' } ] },
      { h: 'Follow up, follow through', p: 'Starting is cheap. Finishing and following up is where most people drop the bar.', fields: [
        { id: 'w_loose', type: 'text', label: 'One loose end you\'ll close this week.', ph: 'Submit the Cert IV assessment that\'s been sitting at 80%' } ] },
      { h: 'There are 24 hours. Use them.', p: 'Account for an ordinary weekday and see what\'s left.', fields: [
        { id: 'w_sleep', type: 'range', label: 'Sleep', min: 0, max: 12, step: .5, def: 8, unit: 'h' },
        { id: 'w_job', type: 'range', label: 'Work or study', min: 0, max: 14, step: .5, def: 8, unit: 'h' },
        { id: 'w_travel', type: 'range', label: 'Travel', min: 0, max: 6, step: .5, def: 1, unit: 'h' },
        { id: 'w_life', type: 'range', label: 'Meals, chores, family, training', min: 0, max: 10, step: .5, def: 4, unit: 'h' },
        { id: 'w_screen', type: 'range', label: 'Scrolling and TV', min: 0, max: 8, step: .5, def: 2, unit: 'h' },
        { id: 'w_calc', type: 'calc', fn: hoursCalc },
        { id: 'w_commit', type: 'number', label: 'Hours a week you\'ll give your vision', min: 0, max: 80, ph: '7' } ] }
    ] },
  { id: 'sell', n: 4, kg: 10, color: '--p-green', title: 'Sell, Sell, Sell', key: 's_pitch',
    idea: 'A great idea nobody hears about goes nowhere. You have to explain why your work matters, in terms the people who can help you actually care about.',
    groups: [
      { h: 'Know your customer', p: 'Selling starts with listening. Work out who you need on board and what they want.', fields: [
        { id: 's_cust', type: 'text', label: 'Whose buy-in do you need?', ph: 'First 20 clients, a lender, my partner' },
        { id: 's_care', type: 'textarea', label: 'What do they care about, in their own words?', ph: '"I want to stop feeling sore all the time." "Is this a safe bet?"' } ] },
      { h: 'Make mountains out of molehills', p: 'Small wins, told well, build momentum and credibility.', fields: [
        { id: 's_win', type: 'text', label: 'A recent win, however small, that you can talk up.', ph: 'Client added 30 kg to her deadlift in 10 weeks' } ] },
      { h: 'Let them underestimate you', p: 'Being underestimated is an advantage if you use it to surprise people.', fields: [
        { id: 's_under', type: 'text', label: 'Where do people underestimate you, and how can you use it?', ph: '"Just a tradie." Trades taught me to show up early and finish the job.' } ] },
      { h: 'Be yourself, own the story', p: 'Your background is your pitch. Tell it plainly.', fields: [
        { id: 's_pitch', type: 'textarea', label: 'Your one-line pitch: who you are, what you\'re building, why it matters.', ph: 'Ex-labourer turned strength coach, building a gym for people who think lifting isn\'t for them.' } ] }
    ] },
  { id: 'shift', n: 5, kg: 5, color: '--p-white', title: 'Shift Gears', key: 'g_fail',
    idea: 'Plans break. The vision stays, the route changes. Treat setbacks as information, look for what they open up, and be willing to change lanes.',
    groups: [
      { h: 'Find the positive', p: 'Every setback closes one door and usually opens another. Go looking for it.', fields: [
        { id: 'g_setback', type: 'text', label: 'A current setback', ph: 'Injured shoulder, can\'t train heavy for 8 weeks' },
        { id: 'g_upside', type: 'text', label: 'What does it make possible?', ph: 'Time to learn rehab programming properly' } ] },
      { h: 'Reframe failure', p: 'A failure is only final if you stop. Otherwise it\'s tuition.', fields: [
        { id: 'g_fail', type: 'textarea', label: 'A failure you\'re still carrying. What did it teach you?', ph: 'My first side business folded. Lesson: I never priced my time.' } ] },
      { h: 'Break the rules', p: 'Many rules are just habits other people got used to.', fields: [
        { id: 'g_rule', type: 'text', label: 'Which "rule" about how things are done doesn\'t apply to you?', ph: '"You need a big commercial gym job first"' } ] },
      { h: 'Risk is relative', p: 'Fear inflates risk. Rate it honestly: how likely is the bad outcome, and could you recover?', fields: [
        { id: 'g_risk', type: 'text', label: 'A risk you\'re avoiding', ph: 'Going part-time to coach' },
        { id: 'g_worst', type: 'text', label: 'Worst realistic outcome', ph: 'Six lean months, back to full-time' },
        { id: 'g_like', type: 'range', label: 'How likely is that outcome? (1 rare – 5 almost certain)', min: 1, max: 5, step: 1, def: 3, unit: '/5' },
        { id: 'g_recover', type: 'range', label: 'How easily could you recover? (1 permanent – 5 easily)', min: 1, max: 5, step: 1, def: 3, unit: '/5' },
        { id: 'g_calc', type: 'calc', fn: riskCalc } ] }
    ] },
  { id: 'mind', n: 6, kg: 2.5, color: '--p-red', title: 'Shut Your Mouth, Open Your Mind', key: 'm_q',
    idea: 'You learn more listening than talking. Stay curious, take knowledge from everyone you meet, and then put it to work instead of letting it sit.',
    groups: [
      { h: 'The world can be your classroom', p: 'Anyone further down the road can teach you something.', fields: [
        { id: 'm_mentor', type: 'text', label: 'Who has already done what you want to do? Name two or three.', ph: 'Owner of my local barbell club; a coach I follow; my old foreman' } ] },
      { h: 'Be curious', p: 'Good questions open doors that pitches can\'t.', fields: [
        { id: 'm_q', type: 'textarea', label: 'Three questions you\'d ask them.', ph: '1. What nearly broke the business in year one?\n2. How did you find your first members?\n3. What would you skip if you started again?' } ] },
      { h: 'Be a sponge', p: 'Absorb from books, courses, people, mistakes. Then repeat.', fields: [
        { id: 'm_source', type: 'text', label: 'One book, course or podcast you\'ll finish this month.', ph: 'A small-business bookkeeping course' } ] },
      { h: 'Put your knowledge to good use', p: 'Knowledge you don\'t use fades. Apply it while it\'s fresh.', fields: [
        { id: 'm_apply', type: 'text', label: 'How will you apply what you learn?', ph: 'Build a simple cash-flow sheet for the gym plan' } ] }
    ] },
  { id: 'mirror', n: 7, kg: 1.25, color: '--p-chrome', title: 'Break Your Mirrors', key: 'b_act',
    idea: 'A mirror only shows you. Scrape off the silver backing and it becomes a window onto everyone else. Being useful means turning what you\'ve built outward.',
    groups: [
      { h: 'Everyone benefits from giving back', p: 'Helping others pays you back in purpose, perspective and connection.', fields: [
        { id: 'b_who', type: 'text', label: 'Who could use your help?', ph: 'Teenagers at the local PCYC; mates getting back into training' } ] },
      { h: 'How to give back', p: 'Start with what you already have. It doesn\'t need to be money.', fields: [
        { id: 'b_how', type: 'choices', label: 'What can you give?', options: ['Time', 'Skills', 'Mentoring', 'Money', 'Connections'] },
        { id: 'b_act', type: 'text', label: 'Your first act of giving back', ph: 'Run a free Saturday technique class' },
        { id: 'b_date', type: 'date', label: 'By when?' } ] },
      { h: 'Shatter the glass', p: 'Finish the thought that the whole workbook is building towards.', fields: [
        { id: 'b_useful', type: 'textarea', label: 'Finish the sentence: "I am useful when I…"', ph: '…help someone do something they didn\'t think their body could do.' } ] }
    ] }
];

const EXAMPLE = {
  v_broad: 'Lifting and fixing things. Teaching mates how to train.', v_zoom: 'My own strength gym, coaching beginners and older lifters.', v_space: 'Sunday 7 am walk, no phone',
  v_statement: 'I own a strength gym with 120 members. I coach every morning and people leave stronger than they arrived.', v_mine: true, v_why: 'Training changed my life and I want to pass that on.',
  n_big: 'A coaching method and three locations, each with a free youth programme.', n_doubt: '"Gyms fail." So I\'ll build a paying client list before I sign a lease.', n_planb: 'Going back to full-time site work', n_cut: true, n_first: 'First in my family to run a business',
  w_rep: 'Post one coaching tip and message one potential client', w_freq: 5, w_pain: 'Early starts and awkward sales calls', w_loose: 'Submit the assessment sitting at 80%',
  w_sleep: 7.5, w_job: 8, w_travel: 1, w_life: 4, w_screen: 2.5, w_commit: 10,
  s_cust: 'My first 20 clients', s_care: '"I want to stop feeling sore." "I don\'t want to look stupid in a gym."', s_win: 'Client added 30 kg to her deadlift in 10 weeks', s_under: '"Just a tradie." I show up early and finish the job.', s_pitch: 'Ex-labourer turned strength coach, building a gym for people who think lifting isn\'t for them.',
  g_setback: 'Shoulder injury, no heavy pressing for 8 weeks', g_upside: 'Time to learn rehab programming', g_fail: 'My first side business folded. Lesson: price my time properly.', g_rule: '"You need years in a big commercial gym first"', g_risk: 'Going part-time to coach', g_worst: 'Six lean months, then back to full-time', g_like: 2, g_recover: 4,
  m_mentor: 'Owner of the local barbell club; my old foreman', m_q: '1. What nearly broke you in year one?\n2. How did you find your first members?\n3. What would you skip next time?', m_source: 'A small-business bookkeeping course', m_apply: 'Build a cash-flow sheet for the gym plan',
  b_who: 'Teenagers at the local youth centre', b_how: ['Time', 'Skills'], b_act: 'Run a free Saturday technique class', b_date: '', b_useful: '…help someone do something they didn\'t think their body could do.'
};

const STORE = 'be-useful-workbook-v1';
let state = { step: 0, a: {}, week: {} };
try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && s.a) state = Object.assign(state, s); } catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

const FIELDS = {}; TOOLS.forEach(t => t.groups.forEach(g => g.fields.forEach(f => FIELDS[f.id] = f)));
const val = id => { const v = state.a[id]; if (v === undefined || v === '') { const f = FIELDS[id]; return f && f.def !== undefined ? f.def : (f && f.type === 'choices' ? [] : ''); } return v; };
const has = id => { const v = state.a[id]; return Array.isArray(v) ? v.length > 0 : (v !== undefined && String(v).trim() !== '' && v !== false); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round(n * 100) / 100).toString();
const isDone = t => has(t.key);
const STEPS = 9; // intro, 7 tools, plan

function hoursCalc() {
  const used = ['w_sleep', 'w_job', 'w_travel', 'w_life', 'w_screen'].reduce((s, k) => s + Number(val(k)), 0);
  const free = 24 - used; const screen = Number(val('w_screen'));
  if (free < 0) return `<div><span class="big">${fmt(-free)} h</span><span class="k">over 24 hours</span></div><p class="note">That adds up to more than a day. Bring something down until it fits.</p>`;
  return `<div><span class="big">${fmt(free)} h</span><span class="k">unaccounted per day</span></div>
    <div><span class="big">${fmt(free * 7)} h</span><span class="k">per week</span></div>
    <div><span class="big">${fmt((free + screen) * 7)} h</span><span class="k">per week if screens went to the vision</span></div>
    <p class="note">You don't need all of it. Pick a number below you'll actually protect.</p>`;
}
function riskCalc() {
  const l = Number(val('g_like')), r = Number(val('g_recover')); const score = l * (6 - r);
  let label, color, note;
  if (score <= 6) { label = 'Low real risk'; color = 'var(--p-green)'; note = 'Unlikely, or easy to recover from. Fear is probably doing most of the talking.'; }
  else if (score <= 12) { label = 'Moderate risk'; color = '#B07D00'; note = 'Worth taking with a plan. Decide what you\'d do if the worst case arrives.'; }
  else { label = 'High risk'; color = 'var(--p-red)'; note = 'Likely and hard to undo. Look for a smaller first step that tests the idea.'; }
  return `<div><span class="big">${score}</span><span class="k">score out of 25</span></div><div><span class="pill" style="background:${color}">${label}</span></div><p class="note">${note}</p>`;
}

/* ---------- barbell ---------- */
const PLATE_DIM = { 25: [26, 100], 20: [22, 100], 15: [18, 100], 10: [15, 100], 5: [11, 60], 2.5: [9, 46], 1.25: [7, 36] };
function renderBar() {
  const L = document.getElementById('sideL'), R = document.getElementById('sideR');
  const h = document.querySelector('.barbell').clientHeight;
  const plates = TOOLS.map(t => {
    const [w, hp] = PLATE_DIM[t.kg]; const done = isDone(t);
    return `<div class="plate${done ? '' : ' empty'}" title="${t.kg} kg · ${esc(t.title)}" style="width:${w * (h / 92)}px;height:${hp}%;${done ? `background:var(${t.color})` : ''}"></div>`;
  }).join('');
  L.innerHTML = plates + '<div class="collar"></div>'; R.innerHTML = plates + '<div class="collar"></div>';
  const done = TOOLS.filter(isDone); const total = 20 + 2 * done.reduce((s, t) => s + t.kg, 0);
  document.getElementById('kg').textContent = fmt(total) + ' kg';
  document.getElementById('kgsub').textContent = done.length === 0 ? 'empty bar · 0 of 7 tools' : `${done.length} of 7 tools loaded`;
  document.getElementById('legend').innerHTML = TOOLS.map(t => `<span class="${isDone(t) ? '' : 'off'}"><i style="background:var(${t.color})"></i>${t.kg} kg ${t.n}</span>`).join('');
}

/* ---------- rail ---------- */
function renderRail() {
  const items = [{ n: '▸', name: 'Start' }, ...TOOLS.map(t => ({ n: t.n, name: t.title, t })), { n: '✓', name: 'Your plan' }];
  document.getElementById('rail').innerHTML = items.map((it, i) =>
    `<button type="button" data-go="${i}" class="${it.t && isDone(it.t) ? 'done' : ''}" ${state.step === i ? 'aria-current="step"' : ''} aria-label="${esc(it.name)}${it.t && isDone(it.t) ? ' (done)' : ''}">
      <span class="num">${it.n}</span><span class="name">${esc(it.name)}</span>${it.t ? `<span class="chip" style="${isDone(it.t) ? `background:var(${it.t.color})` : ''}"></span>` : '<span></span>'}
    </button>`).join('');
}

/* ---------- fields ---------- */
function fieldHTML(f) {
  const v = val(f.id);
  switch (f.type) {
    case 'text': return `<div class="field"><label for="${f.id}">${esc(f.label)}</label><input type="text" id="${f.id}" data-f="${f.id}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" autocomplete="off">${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
    case 'textarea': return `<div class="field"><label for="${f.id}">${esc(f.label)}</label><textarea id="${f.id}" data-f="${f.id}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
    case 'number': return `<div class="field"><label for="${f.id}">${esc(f.label)}</label><input type="number" inputmode="decimal" id="${f.id}" data-f="${f.id}" value="${esc(v)}" min="${f.min}" max="${f.max}" placeholder="${esc(f.ph || '')}"></div>`;
    case 'date': return `<div class="field"><label for="${f.id}">${esc(f.label)}</label><input type="date" id="${f.id}" data-f="${f.id}" value="${esc(v)}"></div>`;
    case 'check': return `<label class="check"><input type="checkbox" id="${f.id}" data-f="${f.id}" ${v ? 'checked' : ''}><span>${esc(f.label)}</span></label>`;
    case 'range': return `<div class="field"><label for="${f.id}">${esc(f.label)}</label><div class="range"><input type="range" id="${f.id}" data-f="${f.id}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}"><output for="${f.id}" id="${f.id}_o">${fmt(v)} ${f.unit}</output></div></div>`;
    case 'choices': return `<div class="field"><span class="lbl" id="${f.id}_l">${esc(f.label)}</span><div class="choices" role="group" aria-labelledby="${f.id}_l">${f.options.map((o, i) => `<label><input type="checkbox" id="${f.id}_${i}" data-f="${f.id}" data-opt="${esc(o)}" ${v.includes(o) ? 'checked' : ''}>${esc(o)}</label>`).join('')}</div></div>`;
    case 'calc': return `<div class="calc" id="${f.id}" aria-live="polite">${f.fn()}</div>`;
  }
}

/* ---------- panels ---------- */
function introHTML() {
  return `<div class="eyebrow">Workbook · 7 tools · about 25 minutes</div>
  <h2>Turn the book into this week's work</h2>
  <p class="intro-lede">Each tool from <em>Be Useful</em> becomes a short station: the idea in a few lines, then questions you answer for your own life. Finish a tool and its plate goes on the bar. At the end you get one page: your vision, your daily rep, your pitch, and a checklist for the next seven days.</p>
  <div class="tool-grid">${TOOLS.map(t => `<button type="button" class="tool-card" data-go="${t.n}"><i style="background:var(${t.color})"></i><b>${esc(t.title)}</b><small>Tool ${t.n} · ${t.kg} kg plate${isDone(t) ? ' · loaded' : ''}</small></button>`).join('')}</div>
  <div class="nav"><div class="btn-row"><button type="button" class="btn quiet" id="loadEx">Load a worked example</button><button type="button" class="btn quiet" id="clearAll">Clear my answers</button></div><button type="button" class="btn primary" data-go="1">Start with Tool 1 →</button></div>
  <div id="confirmBox"></div>
  <p class="notice">Answers are saved in this browser only, so they'll be here when you come back on this device. Nothing is sent anywhere.</p>`;
}
function toolHTML(t) {
  return `<div class="eyebrow"><i style="background:var(${t.color})"></i>Tool ${t.n} of 7 · ${t.kg} kg plate</div>
  <h2>${esc(t.title)}</h2>
  <p class="idea">${esc(t.idea)}</p>
  ${t.groups.map(g => `<section class="group"><h3>${esc(g.h)}</h3><p>${esc(g.p)}</p>${g.fields.map(fieldHTML).join('')}</section>`).join('')}
  <div class="nav"><button type="button" class="btn" data-go="${t.n - 1}">← ${t.n === 1 ? 'Start' : 'Tool ' + (t.n - 1)}</button>
  <button type="button" class="btn primary" data-go="${t.n + 1}">${t.n === 7 ? 'Build my plan →' : 'Next: ' + esc(TOOLS[t.n].title) + ' →'}</button></div>`;
}
function weekItems() {
  const items = [];
  if (has('w_rep')) items.push(['rep', `Daily rep, ${val('w_freq')} days: ${val('w_rep')}`]);
  if (has('w_commit')) items.push(['hours', `Protect ${val('w_commit')} hours for the vision and put them in the calendar`]);
  if (has('v_space')) items.push(['space', `Thinking time: ${val('v_space')}`]);
  if (has('w_loose')) items.push(['loose', `Close the loop: ${val('w_loose')}`]);
  if (has('s_pitch')) items.push(['pitch', `Say your pitch out loud to someone${has('s_cust') ? ' from: ' + val('s_cust') : ''}`]);
  if (has('m_mentor')) items.push(['mentor', `Contact one of: ${val('m_mentor')}, and ask your questions`]);
  if (has('m_source')) items.push(['source', `Start: ${val('m_source')}`]);
  if (has('b_act')) items.push(['give', `Give back: ${val('b_act')}${has('b_date') ? ' (by ' + new Date(val('b_date') + 'T00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ')' : ''}`]);
  return items;
}
function planText() {
  const L = ['BE USEFUL: MY PLAN', '', 'VISION', val('v_statement') || '-', ''];
  const add = (h, ...ids) => { const vals = ids.filter(has).map(i => Array.isArray(val(i)) ? val(i).join(', ') : val(i)); if (vals.length) L.push(h.toUpperCase(), ...vals, ''); };
  add('All-in version', 'n_big'); add('Daily rep', 'w_rep'); add('Pitch', 's_pitch'); add('Lesson from failure', 'g_fail');
  add('Learning from', 'm_mentor', 'm_source'); add('Giving back', 'b_act'); add('I am useful when I', 'b_useful');
  const w = weekItems(); if (w.length) { L.push('THIS WEEK'); w.forEach(([k, t]) => L.push(`[${state.week[k] ? 'x' : ' '}] ${t}`)); }
  return L.join('\n');
}
function planHTML() {
  const card = (t, label, id, extra = '') => `<div class="plan-item" style="--c:var(${t.color})"><h4>${t.n} · ${esc(label)}</h4>${has(id) ? `<p>${esc(Array.isArray(val(id)) ? val(id).join(', ') : val(id))}${extra}</p>` : `<p class="empty">Not answered yet</p><button type="button" class="go" data-go="${t.n}">Go to tool ${t.n} →</button>`}</div>`;
  const T = Object.fromEntries(TOOLS.map(t => [t.id, t]));
  const w = weekItems(); const done = TOOLS.filter(isDone).length;
  return `<div class="eyebrow">Your plan · ${done} of 7 tools loaded</div>
  <h2>Be useful, starting this week</h2>
  <div class="vision-hero"><h4>Vision</h4><p>${has('v_statement') ? esc(val('v_statement')) : '<span style="color:var(--muted)">Write your vision in Tool 1 and it lands here.</span>'}</p></div>
  <div class="plan-grid">
    ${card(T.big, 'All-in version', 'n_big')}
    ${card(T.work, 'Daily rep', 'w_rep', has('w_rep') ? ` · ${esc(val('w_freq'))} days a week` : '')}
    ${card(T.sell, 'Your pitch', 's_pitch')}
    ${card(T.shift, 'Lesson from failure', 'g_fail')}
    ${card(T.mind, 'Questions to ask', 'm_q')}
    ${card(T.mirror, 'First act of giving back', 'b_act')}
  </div>
  ${has('b_useful') ? `<div class="vision-hero"><h4>I am useful when I</h4><p>${esc(val('b_useful'))}</p></div>` : ''}
  <section class="week"><h3>This week</h3>
  ${w.length ? `<ul>${w.map(([k, t]) => `<li><label><input type="checkbox" id="wk_${k}" data-week="${k}" ${state.week[k] ? 'checked' : ''}><span>${esc(t)}</span></label></li>`).join('')}</ul>` : '<p class="notice">Your checklist builds itself from your answers. Fill in a few tools and come back.</p>'}
  </section>
  <div class="nav"><button type="button" class="btn" data-go="7">← Tool 7</button><div class="btn-row"><span class="copied" id="copied" aria-live="polite"></span><button type="button" class="btn primary" id="copyPlan">Copy plan as text</button></div></div>
  <textarea id="planFallback" hidden readonly></textarea>
  <p class="source">Built on the seven tools in <em>Be Useful: Seven Tools for Life</em> by Arnold Schwarzenegger (Penguin Press, 2023). The summaries here are paraphrased.</p>`;
}

function render(focus) {
  const p = document.getElementById('panel'); const s = state.step;
  p.innerHTML = s === 0 ? introHTML() : s === 8 ? planHTML() : toolHTML(TOOLS[s - 1]);
  renderRail(); renderBar();
  if (focus) { p.querySelector('h2')?.setAttribute('tabindex', '-1'); p.querySelector('h2')?.focus({ preventScroll: true }); window.scrollTo({ top: Math.max(0, document.querySelector('.shell').offsetTop - 12), behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { state.step = Math.max(0, Math.min(STEPS - 1, Number(go.dataset.go))); save(); render(true); return; }
  if (e.target.id === 'loadEx') {
    const anyAnswers = Object.keys(state.a).length > 0;
    if (anyAnswers) { document.getElementById('confirmBox').innerHTML = `<div class="confirm"><span>Replace your answers with the example?</span><button type="button" class="btn" id="exYes">Replace</button><button type="button" class="btn quiet" id="exNo">Keep mine</button></div>`; return; }
    state.a = JSON.parse(JSON.stringify(EXAMPLE)); save(); render();
  }
  if (e.target.id === 'exYes') { state.a = JSON.parse(JSON.stringify(EXAMPLE)); state.week = {}; save(); render(); }
  if (e.target.id === 'exNo') { document.getElementById('confirmBox').innerHTML = ''; }
  if (e.target.id === 'clearAll') { document.getElementById('confirmBox').innerHTML = `<div class="confirm"><span>Clear every answer and the checklist?</span><button type="button" class="btn" id="clrYes">Clear all</button><button type="button" class="btn quiet" id="exNo">Cancel</button></div>`; }
  if (e.target.id === 'clrYes') { state.a = {}; state.week = {}; save(); render(); }
  if (e.target.id === 'copyPlan') {
    const text = planText(); const msg = document.getElementById('copied');
    const fallback = () => { const ta = document.getElementById('planFallback'); ta.hidden = false; ta.value = text; ta.style.minHeight = '220px'; ta.select(); msg.textContent = 'Selected below. Copy with Ctrl/Cmd+C.'; };
    try { navigator.clipboard.writeText(text).then(() => { msg.textContent = 'Copied'; }, fallback); } catch (err) { fallback(); }
  }
});
document.addEventListener('input', e => {
  const el = e.target; const id = el.dataset.f;
  if (el.dataset.week) { state.week[el.dataset.week] = el.checked; save(); return; }
  if (!id) return;
  const f = FIELDS[id];
  if (f.type === 'check') state.a[id] = el.checked;
  else if (f.type === 'choices') state.a[id] = [...document.querySelectorAll(`[data-f="${id}"]:checked`)].map(x => x.dataset.opt);
  else if (f.type === 'range') { state.a[id] = Number(el.value); document.getElementById(id + '_o').textContent = fmt(el.value) + ' ' + f.unit; }
  else state.a[id] = el.value;
  save();
  document.querySelectorAll('.calc').forEach(c => { const cf = FIELDS[c.id]; if (cf) c.innerHTML = cf.fn(); });
  renderRail(); renderBar();
});
document.addEventListener('change', e => { if (e.target.dataset.week) { state.week[e.target.dataset.week] = e.target.checked; save(); } });
addEventListener('resize', renderBar);
render();
</script>

</body></html>
