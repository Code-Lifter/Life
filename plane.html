<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Bag Checker | Wizard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        h1, h2, h3 { font-family: 'Fredoka', sans-serif; }
        
        /* Remove arrows from number inputs */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .transition-all { transition: all 0.2s ease-in-out; }

        /* Step transitions */
        .step-container { display: none; animation: fadeIn 0.3s ease-in-out; }
        .step-container.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <!-- Header -->
    <div class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">✈️</span>
                <h1 class="text-xl font-semibold tracking-tight text-gray-900">BagChecker <span class="text-gray-400 text-sm font-normal">| Wizard Mode</span></h1>
            </div>
        </div>
    </div>

    <!-- Wizard Progress Bar -->
    <div class="max-w-3xl mx-auto w-full px-4 pt-8">
        <div class="flex items-center justify-between relative">
            <div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-1 bg-gray-200 -z-10 rounded-full"></div>
            <div id="progress-bar" class="absolute left-0 top-1/2 transform -translate-y-1/2 h-1 bg-black -z-10 rounded-full transition-all duration-300" style="width: 0%;"></div>
            
            <div class="flex flex-col items-center gap-2" id="nav-step-1">
                <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm bg-black text-white border-2 border-black transition-colors">1</div>
                <span class="text-xs font-bold uppercase tracking-wider text-black">Bags</span>
            </div>
            <div class="flex flex-col items-center gap-2" id="nav-step-2">
                <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm bg-gray-200 text-gray-500 border-2 border-gray-200 transition-colors">2</div>
                <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Flights</span>
            </div>
            <div class="flex flex-col items-center gap-2" id="nav-step-3">
                <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm bg-gray-200 text-gray-500 border-2 border-gray-200 transition-colors">3</div>
                <span class="text-xs font-bold uppercase tracking-wider text-gray-500">Results</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-5xl mx-auto px-4 mt-8 flex-1 w-full pb-32">
        
        <!-- STEP 1: BAGS -->
        <div id="step-1" class="step-container active space-y-6">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-semibold text-gray-800">My Bags</h2>
                    <p class="text-sm text-gray-500 mt-1">Add the luggage you plan to travel with.</p>
                </div>
                <button onclick="addBag()" class="bg-white border border-gray-300 text-gray-700 px-5 py-2.5 rounded-xl font-medium text-sm hover:bg-gray-50 transition shadow-sm flex items-center gap-2">
                    <span>+</span> Add Bag
                </button>
            </div>
            <div id="bags-container" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- STEP 2: FLIGHTS -->
        <div id="step-2" class="step-container space-y-6">
             <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-3xl font-semibold text-gray-800">Flight Limits</h2>
                    <p class="text-sm text-gray-500 mt-1">Add your flights and their specific baggage allowances.</p>
                </div>
                <button onclick="addFlight()" class="bg-white border border-gray-300 text-gray-700 px-5 py-2.5 rounded-xl font-medium text-sm hover:bg-gray-50 transition shadow-sm flex items-center gap-2">
                    <span>+</span> Add Flight
                </button>
            </div>
            <div id="flights-container" class="space-y-8"></div>
        </div>

        <!-- STEP 3: RESULTS -->
        <div id="step-3" class="step-container space-y-6">
            <div>
                <h2 class="text-3xl font-semibold text-gray-800">Will it fit?</h2>
                <p class="text-sm text-gray-500 mt-1">Here is the final check for all your bags across all flights.</p>
            </div>
            <div id="results-container" class="space-y-8"></div>
        </div>

    </div>

    <!-- Footer Controls -->
    <div class="fixed bottom-0 w-full bg-white border-t border-gray-200 p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <button id="btn-prev" onclick="prevStep()" class="text-gray-500 font-medium px-6 py-3 rounded-xl hover:bg-gray-100 transition invisible">
                ← Back
            </button>
            <button id="btn-next" onclick="nextStep()" class="bg-black text-white px-8 py-3 rounded-xl font-medium hover:bg-gray-800 transition shadow-lg shadow-gray-200/50 flex items-center gap-2">
                Continue →
            </button>
        </div>
    </div>

    <script>
        // --- DATA ---
        let myBags = [
            { id: 1, name: "Blue Backpack", type: "carry", h: 50, w: 35, d: 20, kg: 8 },
            { id: 2, name: "Big Samsonite", type: "check", h: 75, w: 50, d: 30, kg: 24 }
        ];

        let flights = [
            {
                id: 101,
                name: "London to Bali",
                limits: { carry: { h: 56, w: 36, d: 23, kg: 10 }, check: { h: 90, w: 75, d: 43, kg: 23 } }
            },
            {
                id: 102,
                name: "Bali to Auckland",
                limits: { carry: { h: 48, w: 34, d: 23, kg: 7 }, check: { h: 158, w: 0, d: 0, kg: 20 } }
            }
        ];

        // --- WIZARD STATE ---
        let currentStep = 1;
        const totalSteps = 3;

        function updateWizardUI() {
            // Update containers
            document.querySelectorAll('.step-container').forEach((el, index) => {
                el.classList.toggle('active', index + 1 === currentStep);
            });

            // Render specific step content
            if (currentStep === 1) renderBags();
            if (currentStep === 2) renderFlights();
            if (currentStep === 3) renderResults();

            // Update progress bar & bubbles
            document.getElementById('progress-bar').style.width = ((currentStep - 1) / (totalSteps - 1)) * 100 + '%';
            
            for (let i = 1; i <= totalSteps; i++) {
                const stepNav = document.getElementById(`nav-step-${i}`);
                const circle = stepNav.querySelector('div');
                const label = stepNav.querySelector('span');

                if (i <= currentStep) {
                    circle.className = "w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm bg-black text-white border-2 border-black transition-colors";
                    label.className = "text-xs font-bold uppercase tracking-wider text-black";
                } else {
                    circle.className = "w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm bg-gray-200 text-gray-500 border-2 border-gray-200 transition-colors";
                    label.className = "text-xs font-bold uppercase tracking-wider text-gray-500";
                }
            }

            // Update buttons
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            btnPrev.classList.toggle('invisible', currentStep === 1);
            
            if (currentStep === totalSteps) {
                btnNext.innerHTML = 'Restart ↻';
                btnNext.onclick = () => { currentStep = 1; updateWizardUI(); };
            } else {
                btnNext.innerHTML = 'Continue →';
                btnNext.onclick = nextStep;
            }
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                updateWizardUI();
                window.scrollTo(0, 0);
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                updateWizardUI();
                window.scrollTo(0, 0);
            }
        }

        // --- 1. RENDER BAGS (Step 1) ---
        function renderBags() {
            const container = document.getElementById('bags-container');
            container.innerHTML = '';
            
            myBags.forEach((bag, idx) => {
                const isCarry = bag.type === 'carry';
                
                // Segmented Switch UI for Bag Type
                container.innerHTML += `
                    <div class="bg-white rounded-2xl p-5 border border-gray-200 shadow-sm relative group">
                        <button onclick="deleteBag(${idx})" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 p-1">✕</button>
                        
                        <div class="mb-4">
                            <input type="text" value="${bag.name}" oninput="updateBagData(${idx}, 'name', this.value)" onfocus="this.select()"
                                class="w-full text-lg font-bold text-gray-800 border-none focus:ring-0 p-0 placeholder-gray-300" placeholder="Bag Name">
                            
                            <div class="flex mt-3 bg-gray-100 p-1 rounded-xl relative">
                                <button onclick="setBagType(${idx}, 'carry')" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 ${isCarry ? 'bg-white shadow-sm text-sky-700' : 'text-gray-500 hover:text-gray-700'}">
                                    🎒 Cabin
                                </button>
                                <button onclick="setBagType(${idx}, 'check')" class="flex-1 py-1.5 text-xs font-bold rounded-lg transition-all duration-200 ${!isCarry ? 'bg-white shadow-sm text-amber-700' : 'text-gray-500 hover:text-gray-700'}">
                                    🧳 Hold
                                </button>
                            </div>
                        </div>

                        <div class="grid grid-cols-4 gap-2">
                            ${renderBigInput(idx, 'h', bag.h, 'Height')}
                            ${renderBigInput(idx, 'w', bag.w, 'Width')}
                            ${renderBigInput(idx, 'd', bag.d, 'Depth')}
                            ${renderBigInput(idx, 'kg', bag.kg, 'Weight')}
                        </div>
                    </div>
                `;
            });
        }

        function renderBigInput(idx, field, val, label) {
            return `
                <div class="bg-gray-50 rounded-xl p-2 text-center border border-gray-100 focus-within:border-black focus-within:bg-gray-100 transition-colors">
                    <input type="number" value="${val}" oninput="updateBagData(${idx}, '${field}', this.value)" onfocus="this.select()"
                        class="w-full bg-transparent text-center font-bold text-gray-800 outline-none text-lg">
                    <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wide">${label}</div>
                </div>
            `;
        }

        // --- 2. RENDER FLIGHTS (Step 2) ---
        function renderFlights() {
            const container = document.getElementById('flights-container');
            container.innerHTML = '';

            flights.forEach((flight, fIdx) => {
                container.innerHTML += `
                    <div class="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden">
                        <div class="bg-gray-900 text-white px-6 py-4 flex justify-between items-center">
                            <input type="text" value="${flight.name}" oninput="updateFlightName(${fIdx}, this.value)" onfocus="this.select()"
                                class="bg-transparent text-white font-bold text-lg border-none focus:ring-0 w-full outline-none placeholder-gray-500">
                            <button onclick="deleteFlight(${fIdx})" class="text-gray-500 hover:text-white transition">✕</button>
                        </div>

                        <div class="grid md:grid-cols-2">
                            <div class="p-6 bg-sky-50/50 border-r border-gray-100">
                                <div class="flex items-center gap-2 mb-6 text-sky-800">
                                    <span class="text-2xl">🎒</span>
                                    <div><h3 class="font-bold text-lg leading-tight">Cabin Limits</h3><p class="text-xs text-sky-600 font-medium">Max overhead allowance</p></div>
                                </div>
                                <div class="bg-white rounded-xl border border-sky-100 p-4 shadow-sm">
                                    <div class="grid grid-cols-4 gap-4">
                                        ${renderLimitInput(fIdx, 'carry', 'h', flight.limits.carry)}
                                        ${renderLimitInput(fIdx, 'carry', 'w', flight.limits.carry)}
                                        ${renderLimitInput(fIdx, 'carry', 'd', flight.limits.carry)}
                                        ${renderLimitInput(fIdx, 'carry', 'kg', flight.limits.carry)}
                                    </div>
                                </div>
                            </div>

                            <div class="p-6 bg-amber-50/50">
                                <div class="flex items-center gap-2 mb-6 text-amber-800">
                                    <span class="text-2xl">🧳</span>
                                    <div><h3 class="font-bold text-lg leading-tight">Checked Limits</h3><p class="text-xs text-amber-600 font-medium">Max under-plane allowance</p></div>
                                </div>
                                <div class="bg-white rounded-xl border border-amber-100 p-4 shadow-sm">
                                    <div class="grid grid-cols-4 gap-4">
                                        ${renderLimitInput(fIdx, 'check', 'h', flight.limits.check)}
                                        ${renderLimitInput(fIdx, 'check', 'w', flight.limits.check)}
                                        ${renderLimitInput(fIdx, 'check', 'd', flight.limits.check)}
                                        ${renderLimitInput(fIdx, 'check', 'kg', flight.limits.check)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function renderLimitInput(fIdx, type, dim, limits) {
            const val = limits[dim];
            return `
                <div class="text-center">
                    <input type="number" value="${val}" oninput="updateLimitData(${fIdx}, '${type}', '${dim}', this.value)" onfocus="this.select()"
                        class="w-full text-center text-lg font-bold text-gray-700 border-b-2 border-gray-200 focus:border-black outline-none pb-1 bg-transparent transition-colors">
                    <label class="text-[10px] uppercase font-bold text-gray-400 mt-2 block">${dim}</label>
                </div>
            `;
        }

        // --- 3. RENDER RESULTS (Step 3) ---
        function renderResults() {
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            flights.forEach((flight) => {
                const carryBags = myBags.filter(b => b.type === 'carry');
                const checkBags = myBags.filter(b => b.type === 'check');

                const carryHTML = carryBags.length === 0 
                    ? '<div class="text-sm text-gray-400 italic">No cabin bags added</div>' 
                    : carryBags.map(b => getResultHTML(b, flight.limits.carry)).join('');

                const checkHTML = checkBags.length === 0 
                    ? '<div class="text-sm text-gray-400 italic">No checked bags added</div>' 
                    : checkBags.map(b => getResultHTML(b, flight.limits.check)).join('');

                container.innerHTML += `
                    <div class="bg-white rounded-3xl border border-gray-200 shadow-sm overflow-hidden">
                        <div class="bg-gray-900 text-white px-6 py-4 flex items-center gap-3">
                            <span class="text-xl">✈️</span>
                            <h3 class="font-bold text-lg">${flight.name}</h3>
                        </div>
                        <div class="grid md:grid-cols-2 divide-y md:divide-y-0 md:divide-x divide-gray-100">
                            <div class="p-6">
                                <h4 class="text-sm font-bold text-sky-800 uppercase tracking-wider mb-4 border-b border-sky-100 pb-2">Cabin Check</h4>
                                <div class="space-y-3">${carryHTML}</div>
                            </div>
                            <div class="p-6">
                                <h4 class="text-sm font-bold text-amber-800 uppercase tracking-wider mb-4 border-b border-amber-100 pb-2">Hold Check</h4>
                                <div class="space-y-3">${checkHTML}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function getResultHTML(bag, limit) {
            let errors = [];
            if(limit.h > 0 && bag.h > limit.h) errors.push(`Too tall: +${bag.h - limit.h}cm`);
            if(limit.w > 0 && bag.w > limit.w) errors.push(`Too wide: +${bag.w - limit.w}cm`);
            if(limit.d > 0 && bag.d > limit.d) errors.push(`Too deep: +${bag.d - limit.d}cm`);
            if(limit.kg > 0 && bag.kg > limit.kg) errors.push(`Too heavy: +${bag.kg - limit.kg}kg`);

            if (errors.length === 0) {
                return `
                    <div class="bg-green-50 border border-green-200 rounded-xl p-3 flex items-center gap-3">
                        <div class="bg-green-500 text-white rounded-full w-6 h-6 flex items-center justify-center shrink-0 text-sm">✓</div>
                        <div>
                            <div class="font-bold text-green-900 text-sm">${bag.name}</div>
                            <div class="text-[10px] font-bold text-green-700 uppercase">Fits perfectly</div>
                        </div>
                    </div>`;
            } else {
                return `
                    <div class="bg-red-50 border border-red-200 rounded-xl p-3 flex items-start gap-3">
                        <div class="bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center shrink-0 font-bold text-sm">!</div>
                        <div>
                            <div class="font-bold text-red-900 text-sm">${bag.name}</div>
                            <div class="text-xs text-red-700 font-medium mt-1 space-y-1">
                                ${errors.map(e => `<span class="block">• ${e}</span>`).join('')}
                            </div>
                        </div>
                    </div>`;
            }
        }

        // --- 4. DATA UPDATERS ---
        function updateBagData(idx, field, val) {
            myBags[idx][field] = field === 'name' ? val : Number(val);
        }

        function updateLimitData(fIdx, type, dim, val) {
            flights[fIdx].limits[type][dim] = Number(val);
        }

        function updateFlightName(fIdx, val) {
            flights[fIdx].name = val;
        }

        function setBagType(idx, type) {
            myBags[idx].type = type;
            renderBags(); 
        }

        function addBag() {
            myBags.push({ id: Date.now(), name: "New Bag", type: "carry", h: 50, w: 35, d: 20, kg: 7 });
            renderBags();
        }

        function deleteBag(idx) {
            myBags.splice(idx, 1);
            renderBags();
        }

        function addFlight() {
            flights.push({ id: Date.now(), name: "New Flight", limits: { carry: { h:56, w:36, d:23, kg:7 }, check: { h:90, w:75, d:43, kg:23 } } });
            renderFlights();
        }

        function deleteFlight(fIdx) {
            flights.splice(fIdx, 1);
            renderFlights();
        }

        // Initialize Wizard
        updateWizardUI();

    </script>
</body>
</html>
