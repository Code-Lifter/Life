<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidekick Digital Planner v3.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }

        /* Remove default outline */
        input:focus, textarea:focus {
            outline: none;
            background-color: rgba(30, 41, 59, 0.5);
        }

        /* Scrollbar styling */
        .scroller::-webkit-scrollbar {
            width: 6px;
        }
        .scroller::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }

        /* Drag and Drop Styling */
        .dragging {
            opacity: 0.5;
            background-color: #1e293b;
            border: 2px dashed #64748b;
        }
        
        .drag-handle {
            cursor: grab;
        }
        .drag-handle:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-8 bg-slate-950 text-slate-100">

    <div class="bg-slate-900 w-full max-w-[1400px] border-4 border-slate-700 rounded-lg shadow-2xl overflow-hidden flex flex-col">
        
        <div class="bg-slate-950 border-b-4 border-slate-700 p-4 flex justify-between items-center">
            <div class="text-slate-300 font-bold tracking-[0.2em] text-xl">
                SIDEKICK <span class="text-slate-500 text-sm ml-2">DAILY</span>
            </div>
            <div class="flex gap-4">
                <button id="copy-btn" onclick="copyToNotes()" class="text-xs font-bold text-slate-300 hover:text-white border border-slate-600 hover:border-slate-400 px-3 py-1 rounded transition-colors uppercase tracking-widest">
                    Copy to Notes
                </button>
                <button onclick="resetDay()" class="text-xs font-bold text-slate-400 hover:text-red-400 border border-slate-600 hover:border-red-400 px-3 py-1 rounded transition-colors uppercase tracking-widest">
                    Reset Day
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-0 divide-y-4 lg:divide-y-0 lg:divide-x-4 divide-slate-700 h-full">

            <div class="lg:col-span-3 flex flex-col p-4 h-full min-h-[600px]">
                <h2 class="font-bold text-xs uppercase tracking-wider mb-2 border-b-2 border-slate-700 pb-1 text-slate-400">Schedule</h2>
                <div class="flex-grow border-2 border-slate-700 rounded-sm p-2 relative bg-slate-950/50">
                    <div id="schedule-container" class="flex flex-col gap-1 h-full overflow-y-auto scroller">
                        </div>
                </div>
            </div>

            <div class="lg:col-span-5 flex flex-col">
                
                <div class="p-4 flex-grow-0">
                    <h2 class="font-bold text-xs uppercase tracking-wider mb-2 border-b-2 border-slate-700 pb-1 text-slate-400">Daily Priorities</h2>
                    <div id="priorities-container" class="flex flex-col gap-4 mt-2">
                        </div>
                </div>

                <div class="border-t-4 border-slate-700"></div>

                <div class="p-4 flex-grow flex flex-col h-full min-h-[300px]">
                    <h2 class="font-bold text-xs uppercase tracking-wider mb-2 border-b-2 border-slate-700 pb-1 text-slate-400">Notes</h2>
                    <textarea id="notes-area" class="w-full h-full p-4 border-none resize-none text-slate-200 bg-slate-900 leading-6 text-lg placeholder-slate-600" placeholder="Brain dump here..."></textarea>
                </div>
            </div>

            <div class="lg:col-span-4 flex flex-col p-4 h-full min-h-[600px]">
                <h2 class="font-bold text-xs uppercase tracking-wider mb-2 border-b-2 border-slate-700 pb-1 text-slate-400">Tasks</h2>
                <div id="tasks-container" class="flex flex-col gap-3 h-full overflow-y-auto scroller pb-2">
                    </div>
                <button onclick="addNewTask()" class="mt-4 text-xs font-bold text-slate-400 hover:text-white uppercase tracking-wide text-center w-full py-3 border-2 border-dashed border-slate-700 hover:border-slate-500 transition-colors">
                    + Add Task Row
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- 1. INITIALIZATION & DATA LOADING ---
        const DB_KEY = 'sidekickDataV3'; 
        const storedData = JSON.parse(localStorage.getItem(DB_KEY)) || {};

        document.addEventListener('DOMContentLoaded', () => {
            renderSchedule();
            renderPriorities();
            renderNotes();
            renderTasks();
        });

        function saveData() {
            const data = {
                schedule: getScheduleData(),
                priorities: getPrioritiesData(),
                notes: document.getElementById('notes-area').value,
                tasks: getTasksData()
            };
            localStorage.setItem(DB_KEY, JSON.stringify(data));
        }

        // --- RESET FUNCTIONALITY ---
        function resetDay() {
            if (confirm("Are you sure you want to clear the entire planner? This cannot be undone.")) {
                localStorage.removeItem(DB_KEY);
                location.reload(); 
            }
        }

        // --- 2. SCHEDULE SECTION (Sortable) ---
        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            const savedSchedule = storedData.schedule || Array(18).fill({ time: '', text: '' });

            container.innerHTML = '';
            savedSchedule.forEach((item) => createScheduleRow(container, item.time, item.text));
        }

        function createScheduleRow(container, timeVal, textVal) {
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 text-sm p-1 hover:bg-slate-800/60 transition-colors draggable-item';
            row.setAttribute('draggable', 'true');
            
            row.innerHTML = `
                <div class="drag-handle text-slate-600 hover:text-slate-400 p-1">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="8" cy="4" r="2" />
                        <circle cx="8" cy="12" r="2" />
                        <circle cx="8" cy="20" r="2" />
                        <circle cx="16" cy="4" r="2" />
                        <circle cx="16" cy="12" r="2" />
                        <circle cx="16" cy="20" r="2" />
                    </svg>
                </div>
                <input type="text" 
                    class="w-12 text-right bg-transparent text-slate-400 font-mono placeholder-slate-600 focus:text-white border-b border-transparent focus:border-slate-500" 
                    placeholder="00:00" 
                    value="${timeVal}"
                    oninput="saveData()">
                <span class="text-slate-600">|</span>
                <input type="text" 
                    class="flex-grow bg-transparent border-b border-slate-800 text-slate-200 focus:border-slate-400 transition-colors" 
                    value="${textVal}"
                    oninput="saveData()">
            `;

            row.addEventListener('dragstart', handleDragStart);
            row.addEventListener('dragover', handleDragOver);
            row.addEventListener('drop', handleDrop);
            row.addEventListener('dragend', handleDragEnd);

            container.appendChild(row);
        }

        let dragSrcEl = null;

        function handleDragStart(e) {
            dragSrcEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
            this.classList.add('dragging');
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();
            if (dragSrcEl !== this) {
                const container = document.getElementById('schedule-container');
                const items = [...container.children];
                const srcIndex = items.indexOf(dragSrcEl);
                const targetIndex = items.indexOf(this);

                if (srcIndex < targetIndex) {
                    this.after(dragSrcEl);
                } else {
                    this.before(dragSrcEl);
                }
                saveData();
            }
            return false;
        }

        function handleDragEnd() {
            this.classList.remove('dragging');
            saveData();
        }

        function getScheduleData() {
            const rows = document.getElementById('schedule-container').children;
            const data = [];
            for (let row of rows) {
                const inputs = row.querySelectorAll('input');
                data.push({ time: inputs[0].value, text: inputs[1].value });
            }
            return data;
        }

        // --- 3. PRIORITIES SECTION ---
        function renderPriorities() {
            const container = document.getElementById('priorities-container');
            container.innerHTML = '';
            
            // Handle migration from old array of strings to new objects
            let savedPriorities = storedData.priorities || [
                { state: 0, text: '' }, { state: 0, text: '' }, { state: 0, text: '' }
            ];

            if (savedPriorities.length > 0 && typeof savedPriorities[0] === 'string') {
                savedPriorities = savedPriorities.map(text => ({ state: 0, text: text }));
            }
            while(savedPriorities.length < 3) savedPriorities.push({state:0, text:''});

            savedPriorities.slice(0, 3).forEach((prio, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-3 group';
                row.innerHTML = getPrioHTML(prio.state, prio.text, index + 1);
                container.appendChild(row);
            });
        }

        function getPrioHTML(state, text, num) {
            let iconSvg = '';
            let textClass = 'bg-slate-900 text-slate-200';
            
            if (state === 0) { 
                iconSvg = `<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" class="fill-none"/>`;
                textClass = 'text-slate-200';
            } else if (state === 1) { 
                iconSvg = `<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" class="fill-none"/><path d="M12 2 A10 10 0 0 1 12 22 Z" fill="currentColor"/>`;
                textClass = 'text-white font-semibold';
            } else { 
                iconSvg = `<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" class="fill-slate-100"/><path d="M7 12L10 15L17 8" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
                textClass = 'line-through text-slate-500 bg-slate-900/50';
            }

            const placeholders = ["Priority One...", "Priority Two...", "Priority Three..."];

            return `
                <button onclick="cyclePrioState(this)" data-state="${state}" class="flex-shrink-0 focus:outline-none transition-transform hover:scale-110 text-slate-100 w-8 h-8 flex items-center justify-center">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">${iconSvg}</svg>
                </button>
                <input type="text" class="w-full border-b-2 border-slate-700 focus:border-slate-300 bg-transparent p-2 font-medium h-10 text-lg transition-colors placeholder-slate-600 ${textClass}" placeholder="${placeholders[num-1]}" value="${text}" oninput="saveData()">
            `;
        }

        function cyclePrioState(btn) {
            const currentState = parseInt(btn.getAttribute('data-state'));
            const newState = (currentState + 1) % 3;
            const row = btn.parentElement;
            const input = row.querySelector('input');
            const index = Array.from(row.parentElement.children).indexOf(row) + 1;
            row.innerHTML = getPrioHTML(newState, input.value, index);
            saveData();
        }

        function getPrioritiesData() {
            const rows = document.getElementById('priorities-container').children;
            const data = [];
            for (let row of rows) {
                const btn = row.querySelector('button');
                const input = row.querySelector('input');
                data.push({ 
                    text: input.value, 
                    state: parseInt(btn.getAttribute('data-state'))
                });
            }
            return data;
        }

        // --- 4. NOTES SECTION ---
        function renderNotes() {
            const notes = document.getElementById('notes-area');
            notes.value = storedData.notes || '';
            notes.addEventListener('input', saveData);
        }

        // --- 5. TASKS SECTION ---
        function renderTasks() {
            const container = document.getElementById('tasks-container');
            const savedTasks = storedData.tasks || Array(15).fill({ state: 0, text: '' });
            container.innerHTML = '';
            savedTasks.forEach((task) => {
                createTaskRow(container, task.text, task.state);
            });
        }

        function createTaskRow(container, text = '', state = 0) {
            const row = document.createElement('div');
            row.className = 'flex items-center gap-3 group';
            row.innerHTML = getTaskHTML(state, text);
            container.appendChild(row);
        }

        function getTaskHTML(state, text) {
            let iconSvg = '';
            let textClass = 'bg-slate-900 text-slate-200';
            
            if (state === 0) { 
                iconSvg = `<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" class="fill-none"/>`;
                textClass = 'text-slate-200';
            } else if (state === 1) { 
                iconSvg = `<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" class="fill-none"/><path d="M12 2 A10 10 0 0 1 12 22 Z" fill="currentColor"/>`;
                textClass = 'text-white font-semibold';
            } else { 
                iconSvg = `<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" class="fill-slate-100"/><path d="M7 12L10 15L17 8" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
                textClass = 'line-through text-slate-500 bg-slate-900/50';
            }

            return `
                <button onclick="cycleTaskState(this)" data-state="${state}" class="flex-shrink-0 focus:outline-none transition-transform hover:scale-110 text-slate-100 w-6 h-6">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">${iconSvg}</svg>
                </button>
                <input type="text" class="w-full border-b border-slate-700 focus:border-slate-300 bg-transparent p-1 px-2 text-sm transition-all ${textClass}" value="${text}" oninput="saveData()">
            `;
        }

        function addNewTask() {
            const container = document.getElementById('tasks-container');
            createTaskRow(container);
            saveData();
            container.scrollTop = container.scrollHeight;
        }

        function cycleTaskState(btn) {
            const currentState = parseInt(btn.getAttribute('data-state'));
            const newState = (currentState + 1) % 3;
            const row = btn.parentElement;
            const input = row.querySelector('input');
            row.innerHTML = getTaskHTML(newState, input.value);
            saveData();
        }

        function getTasksData() {
            const rows = document.getElementById('tasks-container').children;
            const data = [];
            for (let row of rows) {
                const btn = row.querySelector('button');
                const input = row.querySelector('input');
                data.push({ 
                    text: input.value, 
                    state: parseInt(btn.getAttribute('data-state'))
                });
            }
            return data;
        }

        // --- 6. EXPORTER FUNCTION ---
        async function copyToNotes() {
            const today = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            let exportText = `# SIDEKICK Daily: ${today}\n\n`;
            let hasData = false;

            // 1. Compile Priorities
            const prioRows = document.getElementById('priorities-container').children;
            let prioText = `### Daily Priorities\n`;
            let hasPrio = false;
            let pCount = 1;
            for (let row of prioRows) {
                const btn = row.querySelector('button');
                const input = row.querySelector('input');
                const state = parseInt(btn.getAttribute('data-state'));
                const text = input.value.trim();
                
                if (text) {
                    let checkbox = '[ ]'; 
                    if (state === 1) checkbox = '[/]'; 
                    if (state === 2) checkbox = '[x]'; 
                    
                    prioText += `${pCount}. ${checkbox} ${text}\n`;
                    hasPrio = true;
                    hasData = true;
                }
                pCount++;
            }
            if (hasPrio) exportText += prioText + `\n`;

            // 2. Compile Schedule
            const scheduleRows = document.getElementById('schedule-container').children;
            let scheduleText = `### Schedule\n`;
            let hasSchedule = false;
            for (let row of scheduleRows) {
                const inputs = row.querySelectorAll('input');
                const time = inputs[0].value.trim();
                const text = inputs[1].value.trim();
                if (time || text) {
                    scheduleText += `- **${time || '--:--'}**: ${text}\n`;
                    hasSchedule = true;
                    hasData = true;
                }
            }
            if (hasSchedule) exportText += scheduleText + `\n`;

            // 3. Compile Tasks 
            const taskRows = document.getElementById('tasks-container').children;
            let taskText = `### Tasks\n`;
            let hasTasks = false;
            for (let row of taskRows) {
                const btn = row.querySelector('button');
                const input = row.querySelector('input');
                const state = parseInt(btn.getAttribute('data-state'));
                const text = input.value.trim();
                
                if (text) {
                    let checkbox = '[ ]'; 
                    if (state === 1) checkbox = '[/]'; 
                    if (state === 2) checkbox = '[x]'; 
                    
                    taskText += `- ${checkbox} ${text}\n`;
                    hasTasks = true;
                    hasData = true;
                }
            }
            if (hasTasks) exportText += taskText + `\n`;

            // 4. Compile Notes
            const notes = document.getElementById('notes-area').value.trim();
            if (notes) {
                exportText += `### Notes\n${notes}\n\n`;
                hasData = true;
            }

            if (!hasData) {
                exportText += "*No data logged for today.*";
            }

            // Copy to Clipboard UI Logic
            try {
                await navigator.clipboard.writeText(exportText.trim());
                
                const btn = document.getElementById('copy-btn');
                btn.innerText = 'COPIED!';
                btn.classList.replace('text-slate-300', 'text-green-400');
                btn.classList.replace('border-slate-600', 'border-green-400');
                
                setTimeout(() => {
                    btn.innerText = 'COPY TO NOTES';
                    btn.classList.replace('text-green-400', 'text-slate-300');
                    btn.classList.replace('border-green-400', 'border-slate-600');
                }, 2000);
            } catch (err) {
                alert('Failed to copy to clipboard. Your browser might block this action.');
            }
        }
    </script>
</body>
</html>
