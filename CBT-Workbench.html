<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CBT Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field-notebook workbench — sticky index on the left, one worksheet open at a time on the right; collapses to a section picker on phones */
:root{
  --bg:#eef1ef; --surface:#fbfcfb; --sunk:#e3e9e6; --ink:#1c2928; --muted:#586866; --line:#cfd8d5;
  --accent:#2c6b66; --accent-ink:#ffffff; --accent-soft:#d5e7e3; --ochre:#a8661a; --ochre-soft:#f3e3cc;
  --good:#2f7a4a; --warn:#a8661a; --bad:#a63d3d;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111817; --surface:#18211f; --sunk:#0d1312; --ink:#e3ebe8; --muted:#94a5a1; --line:#2b3735;
  --accent:#72b9ae; --accent-ink:#0d1716; --accent-soft:#1f3532; --ochre:#e1a64e; --ochre-soft:#3a2c18;
  --good:#6cc08a; --warn:#e1a64e; --bad:#e0817d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111817; --surface:#18211f; --sunk:#0d1312; --ink:#e3ebe8; --muted:#94a5a1; --line:#2b3735;
  --accent:#72b9ae; --accent-ink:#0d1716; --accent-soft:#1f3532; --ochre:#e1a64e; --ochre-soft:#3a2c18;
  --good:#6cc08a; --warn:#e1a64e; --bad:#e0817d; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.lede{color:var(--muted);max-width:65ch}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre)}

/* nav */
nav.side{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 16px);align-self:start;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.brand{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.brand b{font-family:var(--f-display);font-size:1.35rem}
.brand span{color:var(--muted);font-size:.85rem}
.navgroup{margin-bottom:16px}
.navgroup .eyebrow{display:block;margin:0 0 6px 10px}
nav.side a{display:block;padding:6px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:.95rem}
nav.side a:hover{background:var(--sunk)}
nav.side a.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.mobnav{display:none}
.help{margin-top:20px;padding:12px;border:1px solid var(--line);border-radius:var(--r);font-size:.82rem;color:var(--muted)}
.help b{color:var(--ink)}

main{min-width:0;display:flex;flex-direction:column;gap:24px}
.head{display:flex;flex-direction:column;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.flat{background:transparent;border-style:dashed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f > span b{color:var(--ink)}
input[type=text],input[type=time],input[type=date],input[type=number],textarea,select{
  font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-size:.9rem}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--bad)}
button.armed{color:var(--bad);border-color:var(--bad)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.out{font-family:var(--f-mono);font-size:.85rem;color:var(--accent);min-width:3.5ch;text-align:right}
.slider{display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.85rem;background:var(--bg);color:var(--ink)}
.chip.on{background:var(--ochre-soft);border-color:var(--ochre);color:var(--ink)}
.chip.x{cursor:default}
.chip.x button{border:0;background:none;padding:0 2px;color:var(--muted);font-size:1rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--ochre-soft);color:var(--ochre)}
.entryhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.date{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.empty{color:var(--muted);font-style:italic}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.6rem}
.stat span{font-size:.82rem;color:var(--muted)}
.banner{border-left:4px solid var(--ochre);background:var(--ochre-soft);padding:12px 14px;border-radius:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 10px;font-size:.8rem;background:var(--bg)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

/* cycle map */
.cycle{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.cycle .q{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.cycle .q h3{font-size:.9rem;margin-bottom:4px}
/* junction */
.junction{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:stretch}
.junction .side{display:flex;flex-direction:column;gap:6px;min-width:0}
.junction .left h3{color:var(--bad)} .junction .right h3{color:var(--good)}
.junction svg{width:100%;height:100%;min-height:120px}
/* breath */
.pacer{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.orb{width:180px;height:180px;max-width:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent-soft),var(--accent));display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-size:1.2rem;transform:scale(.55);transition:transform 4s ease-in-out}
.orb.in{transform:scale(1)}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom, 0px));right:calc(16px + env(safe-area-inset-right, 0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
ol.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;max-width:65ch}

@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.side{display:none}
  .mobnav{display:flex;flex-direction:column;gap:8px}
  .grid3,.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .grid2,.grid3,.grid5,.cycle{grid-template-columns:minmax(0,1fr)}
  .junction{grid-template-columns:minmax(0,1fr)}
  .junction svg{display:none}
  h1{font-size:1.6rem}
}
@media (prefers-reduced-motion: reduce){.orb{transition:none}}
</style>

<div class="wrap">
  <nav class="side" id="side" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- content ---------- */
const TRAPS=[
 ["Catastrophising","Jumping straight to the worst possible outcome."],
 ["All-or-nothing","Seeing things as total success or total failure."],
 ["Over-generalising","Treating one bad event as a pattern that will always repeat."],
 ["Negative filter","Dwelling on what went wrong and discounting what went right."],
 ["Jumping to conclusions","Deciding what's true before checking the facts."],
 ["Mind-reading","Assuming you know what other people think of you."],
 ["Emotional reasoning","Treating a feeling as proof: I feel useless, so I am useless."],
 ["Musts and shoulds","Turning wishes into rigid rules for yourself or others."],
 ["Labelling","Summing up a whole person with one word after one event."],
 ["Blaming","Pinning every bad outcome on yourself, or on someone else."],
 ["Change fallacy","Expecting other people or things to change to suit you."],
 ["Control fallacy","Feeling powerless whenever you're not fully in control."],
 ["Fairness fallacy","Expecting life to keep a fair score and resenting it when it doesn't."],
 ["Reward fallacy","Expecting sacrifice to be paid back and feeling bitter when it isn't."]
];
const VALUES=["Accepting","Affectionate","Aspiring","Assertive","Authentic","Caring","Challenging","Compassionate","Conforming","Cooperating","Courageous","Creative","Curious","Emotionally aware","Encouraging","Equality","Fairness","Fitness","Flexible","Forgiving","Friendliness","Generosity","Gratitude","Honesty","Humility","Humour","Independent","Industrious","Open-minded","Orderly","Patient","Respectful","Responsible","Safe","Self-aware","Self-disciplined","Tenacious","Tolerant","Trusted"];
const STRENGTHS=[["skills","Skills"],["knowledge","Knowledge"],["experience","Experience"],["abilities","Abilities"],["qualities","Personal qualities"]];
const SCALE=[["Worthless","Worthwhile"],["Disrespectful","Respectful"],["Selfish","Helps others"],["Lazy","Works hard"],["Ruthless","Kind"],["Cold","Warm"],["Taking","Giving"],["Unfair","Fair"],["Pitiless","Compassionate"],["Harsh","Caring"],["Offensive","Empathic"],["Insensitive","Sensitive"],["Thoughtless","Considerate"],["Disloyal","Loyal"],["Indifferent","Determined"]];
const WHEEL=[
 ["Joy",["Serenity","Joy","Ecstasy"]],["Trust",["Acceptance","Trust","Admiration"]],
 ["Fear",["Apprehension","Fear","Terror"]],["Surprise",["Distraction","Surprise","Amazement"]],
 ["Sadness",["Pensiveness","Sadness","Grief"]],["Disgust",["Boredom","Disgust","Loathing"]],
 ["Anger",["Annoyance","Anger","Rage"]],["Anticipation",["Interest","Anticipation","Vigilance"]],
 ["Common in CBT",["Anxiety","Guilt","Shame","Hurt","Jealousy","Embarrassment","Frustration","Low mood"]]
];
const SLEEPQ=["I usually fall asleep within 30 minutes of going to bed.","I'm asleep for at least 85% of the time I spend in bed.","I wake no more than once a night for longer than 5 minutes.","If I do wake, I'm back asleep within 20 minutes."];
const SLEEPF=[
 ["Wind-down routine","Something relaxing before bed, without caffeine, alcohol or nicotine late in the day."],
 ["Screens","Putting the phone and laptop away for a while before bed."],
 ["Daytime exercise","Moving during the day, but not hard training right before bed."],
 ["Light","Daylight early in the day and dimmer lights in the evening to set your body clock."],
 ["Sleepy, not just tired","Going to bed when you actually feel sleepy."],
 ["Bed is for sleep","Moving work, scrolling and TV out of the bedroom."],
 ["Clock-watching","Turning the clock away so you're not counting the hours."],
 ["Bedroom","Comfortable bed; a room that's quiet, dark, tidy and cool."],
 ["Lying awake","If you can't sleep, get up and do something calm until sleepy, then go back."]
];
const SHEETS={
 avoidance:{title:"Cost of avoidance",intro:"Look at what avoiding or controlling a difficult thought, feeling or sensation has cost you, and what you'd gain by easing off.",qs:[
  "What thought, feeling or sensation have you been trying to avoid or control?","Everything you've done to avoid or control it.","What has that cost you? Think confidence, health, relationships, work, chances you've missed.","Which of those strategies are you willing to drop?","What discomfort will you need to make room for if you drop them?","What could you achieve longer term if you focused on what you want instead?","How does that move you toward your goals and values?"]},
 lettinggo:{title:"Letting go",intro:"Weigh up what it costs to keep holding on to a thought you keep coming back to.",qs:[
  "The distressing thought you're struggling to let go of.","How do you feel, emotionally and physically, when you're caught up in it?","How does your behaviour change?","What does getting caught up in it cost you or stop you doing?","How does it pull you away from your goals and values?","What would be a more helpful way to respond to it?","What uncomfortable feelings would you need to allow in order to let it go?","If you did, how would that make life healthier or fuller?"]},
 fears:{title:"Facing a fear",intro:"Pick a fear that's holding you back and plan small, real steps toward it.",qs:[
  "A fear that limits your goals or how you want to live.","If you gradually overcame it, how would you act differently, and what would change?","Your thoughts and feelings when you face it.","Small steps you could take while allowing some discomfort.","LIST6:Six steps, easiest to hardest.","Once you've done all six, what will that say about your ability to handle this fear?"]},
 notenough:{title:"Not good enough",intro:"Name the self-criticism your mind keeps replaying, and practise responding to it differently.",qs:[
  "The 'not good enough' criticisms your mind keeps returning to.","Which one hits hardest?","How do you feel, emotionally and physically, when it shows up?","How does your behaviour change?","How could you hold these criticisms more lightly so they matter less?","What could you focus on right now that adds value, while noticing and letting the criticism pass?","How would you feel, on balance, if you did that now?"]}
};
const WORRY2=["What hard evidence supports the worry?","What hard evidence goes against it?","What's the worst that could happen?","What's the best that could happen?","What's the most likely outcome?","What does worrying about it do for you?","What would you say to a mate with this worry?","Practical options open to you","The most useful course of action","What, where, who and when?","How has your view of the worry changed?"];

/* ---------- state ---------- */
const KEY="cbt-workbench-v1";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
function blank(){return{
  problems:[{p:"",u:"",h:""}],
  goals:[0,1,2].map(()=>({title:"",steps:[0,1,2,3].map(()=>({t:"",done:false}))})),
  strengths:{skills:[],knowledge:[],experience:[],abilities:[],qualities:[]},
  values:{},valuesOther:"",change:["","","","","",""],
  balance:{costs:[],benefits:[]},
  maps:[],junction:[],
  thoughts:[{id:uid(),example:true,date:ago(1),situation:"Boss asked to 'have a quick word' at the end of shift.",emotions:[{n:"Anxiety",b:80,a:35}],nat:"I've stuffed something up and I'm about to get let go.",traps:["Catastrophising","Mind-reading"],for:"I left early on Tuesday.",against:"I cleared it beforehand. Last two 'quick words' were about overtime.",balanced:"It could be anything. I'll find out in an hour, and I've been reliable.",}],
  worryTime:"16:30",worries:[],
  schedule:[{id:uid(),example:true,date:ago(2),p:"Finished study module 3",r:"Board game night",c:"Called home",mood:65},{id:uid(),example:true,date:ago(1),p:"Meal prep for the week",r:"Gym, legs",c:"Cooked dinner for us",mood:72}],
  ladder:Array.from({length:8},()=>({fear:"",pred:"",pd:5,ad:"",happened:"",done:false})),
  sheets:{avoidance:[],lettinggo:[],fears:[],notenough:[]},
  scale:{},scaleSnaps:[],
  emotionLog:[],
  sleep:{checks:[false,false,false,false],f:{}},
  log:[{c:"",l:"",a:""}]
}}
function load(){try{const r=localStorage.getItem(KEY);if(r){return Object.assign(blank(),JSON.parse(r))}}catch(e){}return blank()}
let S=load();
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}
function getP(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function setP(o,p,v){const ks=p.split(".");const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{try{return new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}catch(e){return d}};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}

/* ---------- field helpers ---------- */
let fid=0;
const T=(path,label,ph="",rows=0)=>{const id="f"+(fid++);const v=esc(getP(S,path));return `<label class="f" for="${id}"><span>${label}</span>${rows?`<textarea id="${id}" data-bind="${path}" rows="${rows}" placeholder="${esc(ph)}">${v}</textarea>`:`<input type="text" id="${id}" data-bind="${path}" value="${v}" placeholder="${esc(ph)}">`}</label>`};
const R=(path,label,max=100,suffix="")=>{const id="f"+(fid++);const v=getP(S,path)??0;return `<label class="f" for="${id}"><span>${label}</span><span class="slider"><input type="range" id="${id}" min="0" max="${max}" step="${max>10?5:1}" data-bind="${path}" data-num="1" value="${v}"><output class="out" data-out="${path}">${v}${suffix}</output></span></label>`};
const D=(path)=>{const id="f"+(fid++);return `<input type="date" id="${id}" aria-label="Date" data-bind="${path}" value="${esc(getP(S,path))}" style="width:auto">`};
const DEL=(act,args)=>`<button class="ghost" data-act="${act}" ${args} data-confirm="1">Delete</button>`;
const ex=o=>o.example?`<span class="tag">Example · delete when you start</span>`:"";
function head(eyebrow,title,lede){return `<header class="head"><span class="eyebrow">${eyebrow}</span><h1>${title}</h1>${lede?`<p class="lede">${lede}</p>`:""}</header>`}

/* ---------- charts ---------- */
function lineChart(pts,max,labels){
  if(pts.length<2)return `<p class="empty small">Log at least two days to see a trend.</p>`;
  const W=600,H=140,pl=30,pr=10,pt=10,pb=22;const x=i=>pl+i*(W-pl-pr)/(pts.length-1);const y=v=>pt+(1-v/max)*(H-pt-pb);
  const d=pts.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const grid=[0,50,100].map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(g)+3}" text-anchor="end">${g}</text>`).join("");
  const lab=labels.map((l,i)=>(i===0||i===labels.length-1||pts.length<8)?`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`:"").join("");
  const area=`${pl},${y(0)} ${d} ${x(pts.length-1)},${y(0)}`;
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mood over time" style="width:100%;min-width:320px;height:auto">${grid}<polygon points="${area}" fill="var(--accent-soft)" opacity=".7"/><polyline points="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1])}" r="4" fill="var(--accent)"/>${lab}</svg></div>`;
}
function ladderChart(){
  const rows=S.ladder.map((r,i)=>({i,r})).filter(o=>o.r.fear.trim());
  if(!rows.length)return `<p class="empty small">Add a feared situation to see predicted versus actual distress.</p>`;
  const W=600,rowH=26,pl=30,H=rows.length*rowH+24,sx=v=>pl+v*(W-pl-10)/10;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto" role="img" aria-label="Predicted versus actual distress">`;
  [0,5,10].forEach(g=>s+=`<line x1="${sx(g)}" x2="${sx(g)}" y1="0" y2="${H-18}" stroke="var(--line)"/><text x="${sx(g)}" y="${H-4}" text-anchor="middle">${g}</text>`);

 `<section class="panel"><div class="pacer"><div class="orb" id="orb">Ready</div><div class="row"><button class="pri" id="breathBtn" data-act="breath">Start pacer</button><select id="pattern" aria-label="Breathing pattern" style="width:auto"><option value="4,6">In 4 · out 6</option><option value="4,4">In 4 · out 4</option><option value="5,7">In 5 · out 7</option></select></div><p class="small muted" id="breathCount">A longer out-breath helps the body settle.</p></div></section>
 <div class="grid3">
 <section class="panel"><h2>Belly breathing</h2><ol class="steps small"><li>Sit comfortably, feet flat, spine long, shoulders dropped.</li><li>Rest your hands on your belly.</li><li>Let the belly rise as you breathe in and fall as you breathe out.</li><li>Feel the ribs widen at the sides.</li><li>Don't force it; let the breath move by itself.</li><li>Let tension go on every out-breath.</li></ol><p class="small muted">Twice a day.</p></section>
 <section class="panel"><h2>Aware breathing</h2><ol class="steps small"><li>Bring attention to the breath at your nostrils.</li><li>Notice it's slightly cool coming in, warmer going out.</li><li>Keep it even and relaxed.</li><li>When your mind wanders, notice, and come back to the breath.</li><li>Widen attention to sensations through the body, with curiosity.</li></ol></section>
 <section class="panel"><h2>Five-minute recharge</h2><ol class="steps small"><li>Lie down somewhere quiet.</li><li>A few big fake yawns to loosen the jaw.</li><li>Close your eyes; soft belly breathing.</li><li>Release body tension and worries on each out-breath.</li><li>Stretch or shift if you need to.</li><li>Move from thinking to just noticing. Let the floor hold you.</li></ol></section>
 </div>
 <section class="panel flat small muted">Mindfulness also works in everyday moments: the temperature of the water when you wash up, the feel of your legs while you walk, or what you can see, hear, smell, feel and taste right now.</section>`;
V.sleep=()=>{const yes=S.sleep.checks.filter(Boolean).length;return head("Calm and sleep","Sleep check","Four quick questions, then go through the basics of good sleep: what you do now and what you'll change.")+
 `<section class="panel"><h2>Do you sleep well?</h2>${SLEEPQ.map((q,i)=>`<label class="row" style="flex-wrap:nowrap"><input type="checkbox" data-bind="sleep.checks.${i}" data-rerender="1" ${S.sleep.checks[i]?"checked":""}><span>${q}</span></label>`).join("")}<div class="banner small">${yes===4?"All four, and if you wake up feeling rested, you're probably sleeping well.":`${yes} of 4. Working through the factors below may help.`}</div></section>
 <section class="panel"><h2>Sleep basics</h2>${SLEEPF.map(([n,d],i)=>`<div class="stack" style="border-top:1px solid var(--line);padding-top:12px"><div><b>${n}</b> <span class="small muted">${d}</span></div><div class="grid2">${T(`sleep.f.${i}_now`,"What I do now")}${T(`sleep.f.${i}_ch`,"What I'll change")}</div></div>`).join("")}</section>`};
V.log=()=>head("Review","Learning log","After each session or exercise, write down what you covered, what stuck, and what you'll practise next. It becomes your own manual.")+
 S.log.map((l,i)=>`<section class="panel"><div class="entryhead"><h3>Session ${i+1}</h3>${DEL("delRow",`data-list="log" data-i="${i}"`)}</div><div class="grid3">${T(`log.${i}.c`,"<b>What we covered</b>","",3)}${T(`log.${i}.l`,"<b>Key learning</b>","",3)}${T(`log.${i}.a`,"<b>Assignment</b>","",3)}</div></section>`).join("")+`<div><button data-act="addRow" data-list="log">Add a session</button></div>`;
V.backup=()=>head("Review","Backup and move","Everything is stored only in this browser on this device. Copy the backup text somewhere safe (a note, an email to yourself) to keep it or move it to another device.")+
 `<section class="panel"><h2>Your backup</h2><textarea id="bk" rows="6" readonly>${esc(JSON.stringify(S))}</textarea><div class="row"><button class="pri" data-act="copyBk">Copy backup</button><span class="small muted num">${(JSON.stringify(S).length/1024).toFixed(1)} KB</span></div></section>
 <section class="panel"><h2>Restore</h2><textarea id="imp" rows="4" placeholder="Paste a backup here"></textarea><div class="row"><button data-act="import" data-confirm="1">Replace my data with this backup</button></div></section>
 <section class="panel"><h2>Start fresh</h2><p class="small muted">Removes every entry, including the examples.</p><div><button data-act="wipe" data-confirm="1">Clear everything</button></div></section>`;

const NAV=[["Start",[["today","Today"]]],["Set up",[["problems","Problem list"],["goals","Goals"],["strengths","Strengths"],["values","Values"],["balance","Costs and benefits"]]],
 ["Daily tools",[["map","Map what's happening"],["thoughts","Thought records"],["traps","Thinking traps"],["worry","Worry time"],["schedule","Plan your day"],["ladder","Exposure ladder"]]],
 ["Go deeper",[["junction","Choice point"],["avoidance","Cost of avoidance"],["lettinggo","Letting go"],["fears","Facing a fear"],["notenough","Not good enough"],["scale","Self-perception"],["emotions","Name the feeling"]]],
 ["Calm and sleep",[["breathe","Breathing"],["sleep","Sleep check"]]],["Review",[["log","Learning log"],["backup","Backup"]]]];
const HELP=`<div class="help"><b>Need to talk to someone?</b><br>This is a self-help tool, not a replacement for a therapist or GP. In Australia: Lifeline <span class="num">13 11 14</span>, Beyond Blue <span class="num">1300 22 4636</span>, emergencies <span class="num">000</span>. Adapted from the Think CBT Workbook (2017).</div>`;

/* ---------- render ---------- */
function current(){const h=location.hash.slice(1);return V[h]?h:"today"}
function render(keepScroll){
  const v=current();fid=0;
  document.getElementById("side").innerHTML=`<div class="brand"><b>CBT Workbench</b><span>Think it, then do it</span></div>`+NAV.map(([g,items])=>`<div class="navgroup"><span class="eyebrow">${g}</span>${items.map(([id,l])=>`<a href="#${id}" class="${id===v?"on":""}">${l}</a>`).join("")}</div>`).join("")+HELP;
  const mob=`<div class="mobnav"><b style="font-family:var(--f-display);font-size:1.2rem">CBT Workbench</b><select id="navsel" aria-label="Section">${NAV.map(([g,items])=>`<optgroup label="${g}">${items.map(([id,l])=>`<option value="${id}" ${id===v?"selected":""}>${l}</option>`).join("")}</optgroup>`).join("")}</select></div>`;
  const y=window.scrollY;
  document.getElementById("main").innerHTML=mob+V[v]()+`<div class="mobnav">${HELP}</div>`;
  if(keepScroll)window.scrollTo(0,y);
}
window.addEventListener("hashchange",()=>{stopBreath();render();window.scrollTo(0,0)});

document.addEventListener("input",e=>{
  const el=e.target;if(el.id==="navsel"){location.hash=el.value;return}
  const p=el.dataset.bind;if(!p)return;
  let v=el.type==="checkbox"?el.checked:el.value;
  if(el.dataset.num)v=+v;
  if(el.dataset.numn)v=v===""?"":Math.max(0,Math.min(10,+v));
  setP(S,p,v);save();
  const o=document.querySelector(`[data-out="${CSS.escape(p)}"]`);if(o)o.textContent=v+(p.startsWith("scale")||/\.(b|a|mood)$/.test(p)?"%":p.endsWith(".pd")||p.endsWith(".after")?"/10":"");
  if(el.dataset.rerender)render(true);
});
document.addEventListener("change",e=>{if(e.target.dataset.rerenderBlur)render(true);if(e.target.id==="navsel")location.hash=e.target.value});
document.addEventListener("keydown",e=>{
  const el=e.target;if(e.key!=="Enter"||!el.dataset.add)return;e.preventDefault();
  const val=el.value.trim();if(!val)return;getP(S,el.dataset.add).push(val);save();render(true);
  const again=document.querySelector(`[data-add="${el.dataset.add}"]`);again&&again.focus();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  if(b.dataset.confirm&&!b.classList.contains("armed")){b.classList.add("armed");const old=b.textContent;b.textContent="Tap again to confirm";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent=old}},3000);return}
  const a=b.dataset.act,i=+b.dataset.i;
  const A={
    goto:()=>{location.hash=b.dataset.to},
    addRow:()=>{const l=b.dataset.list;S[l].push(l==="problems"?{p:"",u:"",h:""}:{c:"",l:"",a:""})},
    delRow:()=>{S[b.dataset.list].splice(i,1);toast("Deleted")},
    rmItem:()=>{getP(S,b.dataset.list).splice(i,1)},
    newEntry:()=>{S[b.dataset.list].push({id:uid(),date:today()})},
    newThought:()=>{S.thoughts.push({id:uid(),date:today(),situation:"",emotions:[{n:"",b:60,a:60}],nat:"",traps:[],for:"",against:"",balanced:""});if(current()!=="thoughts"){save();location.hash="thoughts";return "skip"}},
    addEmo:()=>{S.thoughts[i].emotions.push({n:"",b:50,a:50})},
    trap:()=>{const t=S.thoughts[i].traps,n=b.dataset.t;const k=t.indexOf(n);k<0?t.push(n):t.splice(k,1)},
    val:()=>{S.values[b.dataset.v]=S.values[b.dataset.v]===b.dataset.k?undefined:b.dataset.k},
    parkWorry:()=>{const q=document.getElementById("wq").value.trim();if(!q){toast("Write the worry first");return "skip"}S.worries.push({id:uid(),date:today(),q,p:document.getElementById("wp").value.trim(),d:+document.getElementById("wd").value,a:{},after:null,done:false});toast("Parked until "+S.worryTime)},
    closeWorry:()=>{const w=S.worries[i];if(w.after==null)w.after=w.d;w.done=true;toast("Let go")},
    addDay:()=>{S.schedule.push({id:uid(),date:today(),p:"",r:"",c:"",mood:50})},
    newSheet:()=>{S.sheets[b.dataset.k].push({id:uid(),date:today(),a:{}})},
    delSheet:()=>{S.sheets[b.dataset.k].splice(i,1);toast("Deleted")},
    snap:()=>{const v=SCALE.map((_,k)=>+(S.scale[k]??50));S.scaleSnaps.push({date:today(),v,avg:Math.round(v.reduce((x,y)=>x+y,0)/v.length)});toast("Snapshot saved")},
    feel:()=>{S.emotionLog.push({date:today(),f:b.dataset.e,t:"",a:""});toast(b.dataset.e+" added below")},
    breath:()=>{breathing?stopBreath():startBreath();return "skip"},
    copyBk:()=>{const t=document.getElementById("bk");const done=()=>toast("Backup copied");navigator.clipboard?.writeText(t.value).then(done).catch(()=>{t.select();toast("Selected; copy it manually")});return "skip"},
    import:()=>{try{const d=JSON.parse(document.getElementById("imp").value);S=Object.assign(blank(),d);toast("Backup restored")}catch(err){toast("That text isn't a valid backup. Paste the whole thing.");return "skip"}},
    wipe:()=>{S=blank();S.thoughts=[];S.schedule=[];toast("Cleared")}
  };
  const r=A[a]&&A[a]();if(r==="skip")return;save();render(true);
});

/* breathing pacer */
let breathing=false,bt;
function startBreath(){const [inn,out]=document.getElementById("pattern").value.split(",").map(Number);const orb=document.getElementById("orb"),cnt=document.getElementById("breathCount"),btn=document.getElementById("breathBtn");breathing=true;btn.textContent="Stop";let cycles=0;
  const phase=(isIn)=>{if(!breathing)return;const s=isIn?inn:out;orb.style.transitionDuration=s+"s";orb.classList.toggle("in",isIn);let left=s;orb.textContent=(isIn?"Breathe in ":"Breathe out ")+left;
    const tick=()=>{if(!breathing)return;left--;if(left>0){orb.textContent=(isIn?"Breathe in ":"Breathe out ")+left;bt=setTimeout(tick,1000)}else{if(!isIn){cycles++;cnt.textContent=cycles+" breath"+(cycles>1?"s":"")+" · "+Math.round(cycles*(inn+out)/6)/10+" min"}phase(!isIn)}};bt=setTimeout(tick,1000)};phase(true)}
function stopBreath(){breathing=false;clearTimeout(bt);const o=document.getElementById("orb");if(o){o.classList.remove("in");o.textContent="Ready"}const b=document.getElementById("breathBtn");if(b)b.textContent="Start pacer"}

render();
</script>

</body></html>
