<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Maker</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{color-scheme:light dark;--bg:light-dark(#1f2a6b,#0f1438);--field:light-dark(#2b3784,#1a2152);--acc:#ffd23f}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#fff;font:17px/1.5 system-ui,sans-serif;padding:20px}
form{width:min(100%,520px);display:grid;gap:14px}
input{font:18px system-ui,sans-serif;padding:16px;border-radius:14px;border:0;background:var(--field);color:#fff;min-height:56px;width:100%}
input::placeholder{color:#aab2e6}
button{font:700 18px system-ui,sans-serif;min-height:56px;border-radius:14px;border:0;background:var(--acc);color:#11152e;cursor:pointer}
.err{color:var(--acc);min-height:1.5em;margin:0;text-align:center}
#full{position:fixed;inset:0;background:#fff;display:none;place-items:center;padding:4vmin;cursor:pointer;z-index:9}
#full.on{display:grid}
#full img{width:min(92vw,92vh);height:auto;aspect-ratio:1;image-rendering:pixelated}
#full p{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#666;font-size:14px;margin:0}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <input id="url" type="text" inputmode="url" placeholder="Paste a link…" aria-label="URL">
  <button type="submit">Show QR code</button>
  <p class="err" id="err"></p>
</form>
<div id="full" role="dialog" aria-label="QR code"><img id="img" alt="QR code"><p>Tap anywhere to close</p></div>
<script>
{
  const $ = id => document.getElementById(id);
  const full = $('full'), err = $('err');

  // Add https:// if someone types "example.com"
  const tidy = v => {
    v = v.trim();
    if (v && !/^[a-z][a-z0-9+.-]*:/i.test(v) && /^\S+\.\S{2,}/.test(v)) v = 'https://' + v;
    return v;
  };

  const show = () => {
    err.textContent = '';
    const text = tidy($('url').value);
    if (!text) { err.textContent = 'Enter a link first.'; return; }
    try {
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
      const qr = qrcode(0, 'M');          // 0 = auto size, M = medium error correction
      qr.addData(text, 'Byte');
      qr.make();
      // Draw the code onto a canvas, then show it as an image
      const n = qr.getModuleCount(), cell = 16, q = 2, px = (n + q * 2) * cell;
      const c = document.createElement('canvas');
      c.width = c.height = px;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, px, px);
      g.fillStyle = '#000';
      for (let r = 0; r < n; r++) for (let k = 0; k < n; k++)
        if (qr.isDark(r, k)) g.fillRect((k + q) * cell, (r + q) * cell, cell, cell);
      $('img').src = c.toDataURL('image/png');
      full.classList.add('on');
      try { document.documentElement.requestFullscreen?.()?.catch(() => {}); } catch (e) {}
      try { localStorage.setItem('qr-last', $('url').value); } catch (e) {}
    } catch (e) {
      err.textContent = 'That link is too long for a QR code.';
    }
  };

  const hide = () => {
    full.classList.remove('on');
    try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  };

  $('f').addEventListener('submit', e => { e.preventDefault(); show(); });
  full.addEventListener('click', hide);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) full.classList.remove('on'); });

  try { const last = localStorage.getItem('qr-last'); if (last) $('url').value = last; } catch (e) {}
}
</script>
</body>
</html>
